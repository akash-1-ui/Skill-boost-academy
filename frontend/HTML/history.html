<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History - Viewed Videos</title>
  <script>
    (() => {
      try {
        document.documentElement.setAttribute('data-theme', 'light');
        document.documentElement.setAttribute('data-theme-role', 'student');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../CSS/home.css?v=20260331-theme-toggle" />
  <link rel="stylesheet" href="../CSS/history.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body class="student-dashboard student-history-page" data-app-role="student">
  <header class="topbar">
    <div class="topbar-left">
      <button class="back-button" id="backBtn" type="button" aria-label="Go back">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="brand">
        <span class="brand-mark">SB</span>
        <div class="brand-text">
          <span class="brand-title">Skill Boost Nexus</span>
          <span class="brand-subtitle">Student Studio</span>
        </div>
      </div>
      <button type="button" class="theme-toggle" id="historyThemeToggle" data-theme-toggle data-theme-role="student">
        <span class="theme-toggle-track" aria-hidden="true">
          <span class="theme-toggle-thumb"></span>
        </span>
        <span class="theme-toggle-text" data-theme-label>Day Mode</span>
      </button>
    </div>
    <div class="topbar-right">
      <span class="status-pill">History</span>
      <button class="profile-icon" id="studentProfileIcon" type="button" aria-label="Open menu">
        <img class="topbar-avatar" id="studentProfilePhoto" src="/uploads/default-avatar.svg" alt="Profile Photo" onerror="this.src='/uploads/default-avatar.svg'" />
      </button>
    </div>
  </header>

  <nav id="sidebar" class="sidebar">
    <ul>
      <li><a href="student_home.html"><i class="fas fa-home"></i> Dashboard</a></li>
      <li><a href="history.html" class="active"><i class="fas fa-play-circle"></i> History</a></li>
      <li><a href="contact.html?from=student"><i class="fas fa-envelope"></i> Contact</a></li>
      <li><a href="#" data-profile-toggle><i class="fas fa-user"></i> Profile</a></li>
      <li>
        <a href="index.html" class="logout-link">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </li>
    </ul>
  </nav>

  <main class="content">
    <section class="history-section">
      <div class="section-header">
        <div>
          <p class="hero-kicker">Learning Record</p>
          <h2>Viewed Videos</h2>
          <p>Keep track of the lessons you have already watched.</p>
        </div>
      </div>
      <div class="history-grid" id="historyGrid" role="list">
        <!-- Watched course cards will be dynamically loaded here -->
      </div>
    </section>
  </main>

  <div class="profile-drawer" id="profileDrawer" data-role="student" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <p class="drawer-eyebrow">Profile</p>
        <h3>Update Student Profile</h3>
      </div>
      <button type="button" class="drawer-close" data-profile-close>Close</button>
    </div>
    <div class="drawer-body">
      <div class="profile-photo">
        <img id="profileImage" src="/uploads/default-avatar.svg" alt="Profile Photo" onerror="this.src='/uploads/default-avatar.svg'">
        <input type="file" id="profilePhotoUpload" accept="image/*">
        <button type="button" class="upload-btn" onclick="document.getElementById('profilePhotoUpload').click()">Upload Photo</button>
      </div>
      <form id="profileForm" class="profile-form">
        <div class="form-group">
          <label for="profileName">Full Name</label>
          <input type="text" id="profileName" placeholder="Enter your full name">
        </div>
        <div class="form-group">
          <label for="profileEmail">Email</label>
          <input type="email" id="profileEmail" placeholder="Enter your email" readonly>
        </div>
        <div class="form-group">
          <label for="profileExtra">Branch</label>
          <input type="text" id="profileExtra" placeholder="Enter your branch">
        </div>
        <button type="submit" class="save-btn">Save Profile</button>
        <p id="profileStatus" class="profile-status"></p>
      </form>
      <div class="profile-danger">
        <button type="button" id="terminateStudent" class="danger-btn">Terminate Account</button>
      </div>
    </div>
  </div>
  <div class="drawer-overlay" id="profileOverlay"></div>

  <script src="../js/app-config.js"></script>
  <script src="../js/theme_mode.js?v=20260331-theme-toggle"></script>
  <script src="../js/profile_drawer.js"></script>
  <script src="../js/page-toast.js"></script>
  <script src="../js/account_actions.js"></script>
  <script>
    const API_BASE = window.SkillBoostApp?.apiBase || window.location.origin;
    const buildApiUrl = window.SkillBoostApp?.buildApiUrl || ((path = '') => `${window.location.origin}${String(path || '').startsWith('/') ? path : `/${path}`}`);
    const DEFAULT_PROFILE_PHOTO = '/uploads/default-avatar.svg';
    function normalizePhoto(value) {
      const raw = String(value || '').trim();
      if (!raw || raw === 'null' || raw === 'undefined') {
        return DEFAULT_PROFILE_PHOTO;
      }
      if (raw.includes('default-profile-picture-avatar-user-icon-vector-46389216.jpg')) {
        return DEFAULT_PROFILE_PHOTO;
      }
      return raw;
    }

    // Set student profile photo in top right, unique per student
    const studentEmail = localStorage.getItem('studentEmail');
    let studentPhoto = DEFAULT_PROFILE_PHOTO;
    if (studentEmail) {
      studentPhoto = normalizePhoto(localStorage.getItem(`studentPhoto_${studentEmail}`));
    }
    document.getElementById('studentProfilePhoto').src = normalizePhoto(studentPhoto);

    // Back button functionality
    const backBtn = document.getElementById('backBtn');
    if (backBtn) {
      backBtn.addEventListener('click', () => {
        window.history.back();
      });
    }

    // Menu toggle logic (profile avatar opens sidebar)
    const toggleBtn = document.getElementById('studentProfileIcon');
    const sidebar = document.getElementById('sidebar');
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sidebar.classList.toggle('show');
    });
    document.addEventListener('click', (e) => {
      if (!sidebar.contains(e.target) && !toggleBtn.contains(e.target)) {
        sidebar.classList.remove('show');
      }
    });
    function resolveAssetPath(rawPath, fallbackBase) {
      if (!rawPath) return '';
      let value = String(rawPath).trim();
      if (!value) return '';
      value = value.replace(/\\/g, '/');
      
      // Handle data URLs and blob URLs as-is
      if (value.startsWith('data:') || value.startsWith('blob:')) {
        return value;
      }
      
      // If it's a Cloudinary URL, return it directly (valid across all environments)
      if (value.includes('res.cloudinary.com')) {
        return value;
      }
      
      const normalizedFallback = fallbackBase.startsWith('/') ? fallbackBase : `/${fallbackBase}`;
      
      // If it's an external URL (http/https), extract just the filename and use current API base
      if (value.startsWith('http://') || value.startsWith('https://')) {
        const filename = value.split('/').pop();
        if (filename) {
          return `${API_BASE}${normalizedFallback}/${filename}`;
        }
        // Fallback if no filename found
        return value;
      }
      
      // Handle Windows paths
      if (/^[a-zA-Z]:\//.test(value)) {
        const filename = value.split('/').pop();
        return `${API_BASE}${normalizedFallback}/${filename}`;
      }
      
      // Handle absolute paths
      if (value.startsWith('/')) {
        return `${API_BASE}${value}`;
      }
      
      // Handle relative paths
      return `${API_BASE}${normalizedFallback}/${value}`;
    }

    // Load viewed videos from backend for the current student
    async function loadHistory() {
      const historyGrid = document.getElementById('historyGrid');
      const studentEmail = localStorage.getItem('studentEmail') || 'guest';
      try {
        // Only use the email, not email + id
        const res = await fetch(buildApiUrl(`/api/course-views/${encodeURIComponent(studentEmail)}`));
        const viewed = await res.json();
        if (!Array.isArray(viewed) || viewed.length === 0) {
          historyGrid.innerHTML = '<div class="no-history-message">📚 No videos viewed yet. Start learning!</div>';
          return;
        }
        historyGrid.innerHTML = '';
        viewed.forEach(course => {
          const card = document.createElement('div');
          card.classList.add('history-card');
          const coverSrc = resolveAssetPath(course.cover_path || course.cover, '/uploads/covers');
          const instructorName = course.instructor_name || 'Unknown Instructor';
          const category = course.category || 'Course';
          const description = course.description || 'No description available.';
          const title = escapeHtml(course.title || 'Untitled course');
          const coverMarkup = coverSrc
            ? `<img src="${coverSrc}" alt="${title}" class="course-cover" loading="lazy" onerror="this.closest('.media-container').classList.add('is-fallback'); this.remove();">`
            : '<div class="course-cover-fallback">No cover</div>';
          
          card.innerHTML = `
            <div class="media-container">
              ${coverMarkup}
            </div>
            <div class="history-card-content">
              <h3>${title}</h3>
              <div class="history-card-meta">
                <span class="history-card-meta-item">
                  <i class="fas fa-bookmark"></i>
                  <strong>${escapeHtml(category)}</strong>
                </span>
              </div>
              <p class="history-card-description">${escapeHtml(description)}</p>
              <p class="history-card-instructor">
                <i class="fas fa-chalkboard-user"></i>
                by <strong>${escapeHtml(instructorName)}</strong>
              </p>
            </div>
          `;
          historyGrid.appendChild(card);
        });
      } catch (err) {
        historyGrid.innerHTML = '<div class="no-history-message">⚠️ Failed to load history. Please try again.</div>';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.addEventListener('DOMContentLoaded', loadHistory);
  </script>
</body>
</html>
